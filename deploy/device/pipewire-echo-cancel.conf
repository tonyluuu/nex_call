# 安装到 ~/.config/pipewire/pipewire.conf.d/60-echo-cancel.conf
# 生成一对虚拟设备：
#   echo-cancel-source  已消除回声、降噪、自动增益后的麦克风
#   echo-cancel-sink    播放设备，作为回声消除的参考信号
# device-agent 只读写这两个设备（setup.sh 会把它们设为默认设备）。
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                webrtc.voice_detection = true
            }
            capture.props = {
                node.name = "echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo Cancel Source"
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.description = "Echo Cancel Sink"
            }
            playback.props = {
                node.name = "echo-cancel-playback"
                node.passive = true
            }
        }
    }
]
