name: server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '!deploy/device/**'
      - '.github/workflows/server.yml'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "${VPS_SSH_PORT}" ]; then
            port=22
          else
            port="$VPS_SSH_PORT"
          fi
          echo "VPS_PORT=$port" >> "$GITHUB_ENV"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 同步到 VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o IdentitiesOnly=yes"
          ssh_cmd=(ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o IdentitiesOnly=yes)
          target="$VPS_USER@$VPS_HOST"
          "${ssh_cmd[@]}" "$target" 'mkdir -p /opt/nex_call/server /opt/nex_call/deploy'
          rsync -az server/ "$target:/opt/nex_call/server/"
          rsync -az \
            --exclude '.env' --exclude 'certs/' --exclude 'acme/' --exclude 'lego/' \
            deploy/ "$target:/opt/nex_call/deploy/"

      - name: 在 VPS 上构建并启动
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o IdentitiesOnly=yes)
          target="$VPS_USER@$VPS_HOST"
          # 源码已经同步过去。在 VPS 上构建可复用本地镜像层，只重编有改动的 Go 代码，
          # 不必再把整份镜像经 SSH 传一遍。go.mod 未变时依赖层直接命中缓存。
          "${ssh_cmd[@]}" "$target" 'cd /opt/nex_call/deploy && docker compose --progress plain up -d --build'
