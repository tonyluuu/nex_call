name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建网页
        working-directory: web
        run: npm ci && npm run build

      - name: 构建 call-server 镜像
        run: docker build -t nex-call-call-server:latest -f server/Dockerfile server

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 打包 device-agent
        run: docker buildx build --platform linux/arm64 -o type=local,dest=./device/dist ./device

      - uses: actions/upload-artifact@v4
        with:
          name: device-agent-linux-arm64
          path: device/dist/device-agent
          if-no-files-found: error

      - name: 配置 SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "${VPS_SSH_PORT}" ]; then
            port=22
          else
            port="$VPS_SSH_PORT"
          fi
          echo "VPS_PORT=$port" >> "$GITHUB_ENV"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: 同步到 VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          export RSYNC_RSH="ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o IdentitiesOnly=yes"
          ssh_cmd=(ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o IdentitiesOnly=yes)
          target="$VPS_USER@$VPS_HOST"
          "${ssh_cmd[@]}" "$target" 'mkdir -p /opt/nex_call/web/dist /opt/nex_call/server /opt/nex_call/deploy /opt/nex_call/dist'
          rsync -az --delete web/dist/ "$target:/opt/nex_call/web/dist/"
          rsync -az server/ "$target:/opt/nex_call/server/"
          rsync -az \
            --exclude '.env' --exclude 'certs/' --exclude 'acme/' --exclude 'lego/' \
            deploy/ "$target:/opt/nex_call/deploy/"
          rsync -az device/dist/device-agent "$target:/opt/nex_call/dist/device-agent"

      - name: 载入镜像并启动
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh_cmd=(ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" -o IdentitiesOnly=yes)
          target="$VPS_USER@$VPS_HOST"
          docker save nex-call-call-server:latest | gzip \
            | "${ssh_cmd[@]}" "$target" "bash -lc 'set -o pipefail; gunzip | docker load'"
          "${ssh_cmd[@]}" "$target" 'cd /opt/nex_call/deploy && docker compose up -d --no-build'
