name: device

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'device/**'
      - '.github/workflows/device.yml'

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 打包 device-agent
        run: docker buildx build --platform linux/arm64 -o type=local,dest=./device/dist ./device

      - uses: actions/upload-artifact@v4
        with:
          name: device-agent-linux-arm64
          path: device/dist/device-agent
          if-no-files-found: error
