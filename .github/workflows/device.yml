name: device

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'device/**'
      - 'deploy/device/**'
      - '.github/workflows/device.yml'

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 打包 device-agent
        # 按 Ubuntu 18.04（glibc 2.27）链接。bookworm 的 glibc 更新，同一份二进制两边都能跑。
        run: docker buildx build --platform linux/arm64 -f device/Dockerfile.bionic -o type=local,dest=./device/dist ./device

      - name: 组装部署包
        run: |
          set -euo pipefail
          stage=dist/nexcall-device
          mkdir -p "$stage"
          cp device/dist/device-agent "$stage/device-agent"
          chmod 755 "$stage/device-agent"
          cp deploy/device/setup.sh \
             deploy/device/install.sh \
             deploy/device/audio-test.sh \
             deploy/device/device-agent.service \
             deploy/device/device.env.example \
             deploy/device/pulse-echo-cancel.pa \
             deploy/device/pipewire-echo-cancel.conf \
             "$stage/"
          chmod 755 "$stage"/*.sh
          tar -C dist -czf dist/nexcall-device-linux-arm64.tar.gz nexcall-device

      - uses: actions/upload-artifact@v4
        with:
          name: nexcall-device-linux-arm64
          path: dist/nexcall-device-linux-arm64.tar.gz
          if-no-files-found: error
